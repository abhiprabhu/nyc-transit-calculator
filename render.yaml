services:
  - type: web
    name: nyc-transit-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nyc-transit-db
          property: connectionString
      - key: PGSSL
        value: "true"
      - key: CORS_ORIGIN
        sync: false

databases:
  - name: nyc-transit-db
    plan: free
